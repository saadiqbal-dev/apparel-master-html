<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <section class="bg-grey padding-section">
      <div class="get-in-touch container">
        <h5 class="fw-medium mb-3">Get in Touch with Us Today</h5>
        <p class="mb-4">
          To send an enquiry, fill in the details below, submit and we will get
          back to you shortly
        </p>
        <form class="contact-form">
          <div class="row g-3">
            <div class="col-md-6">
              <input
                type="text"
                class="form-control"
                id="firstName"
                placeholder="First Name*"
                required
              />
            </div>
            <div class="col-md-6">
              <input
                type="text"
                class="form-control"
                id="lastName"
                placeholder="Last Name*"
                required
              />
            </div>
            <div class="col-md-6">
              <input
                type="text"
                class="form-control"
                id="companyName"
                placeholder="Company Name*"
                required
              />
            </div>
            <div class="col-md-6">
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Email*"
                required
              />
            </div>
            <!-- Email and Phone -->
            <div class="col-md-6">
              <input
                type="tel"
                class="form-control"
                id="phone"
                placeholder="Phone*"
                required
              />
            </div>
            <div class="col-md-6 position-relative">
              <select
                class="form-control"
                id="howCanWeHelp"
                name="howCanWeHelp"
                placeholder="How can we help you?"
              >
                <option value="">How can we help you?</option>
                <option value="volvo">New Business Enquiry</option>
                <option value="saab">Existing Customer Enquiry</option>
                <option value="fiat">Feedback/Comment</option>
                <option value="audi">General Enquiry</option>
              </select>
              <img
                src="public/images/ourServices/drop-down.svg"
                alt="Dropdown"
                class="dropdown-icon"
              />
            </div>

            <!-- Enquiry Details* (full width) -->
            <div class="col-12">
              <textarea
                class="form-control"
                id="enquiryDetails"
                rows="4"
                placeholder="Enquiry Details*"
                required
              ></textarea>
            </div>
            <div class="col-md-6 position-relative">
              <select
                class="form-control"
                id="region"
                name="region"
                placeholder="Region*"
                required
              >
                <option value="">Region*</option>
                <option value="northland">
                  Northland (North of Harbour Bridge)
                </option>
                <option value="auckland">
                  Auckland (South of Harbour Bridge)
                </option>
                <option value="central-north">Central North Island</option>
                <option value="lower-north">Lower North Island</option>
                <option value="south-island">South Island</option>
              </select>
              <img
                src="public/images/ourServices/drop-down.svg"
                alt="Dropdown"
                class="dropdown-icon"
              />
            </div>
            <div class="col-md-6 position-relative">
              <select
                class="form-control"
                id="branch"
                name="branch"
                placeholder="Branch*"
                required
              >
                <option value="">Select Region First*</option>
                <option value="apparelmaster-whangarei" data-region="northland">
                  Apparelmaster Whangarei
                </option>
                <option value="kaipara-apparelmaster" data-region="northland">
                  Kaipara Apparelmaster
                </option>
                <option value="pryors-apparelmaster" data-region="auckland">
                  Pryor's Apparelmaster
                </option>
                <option value="tcl-apparelmaster" data-region="central-north">
                  TCL Apparelmaster
                </option>
                <option
                  value="apparelmaster-waikato"
                  data-region="central-north"
                >
                  Apparelmaster Waikato
                </option>
                <option
                  value="sincerity-apparelmaster"
                  data-region="central-north"
                >
                  Sincerity Apparelmaster
                </option>
                <option
                  value="rotorua-apparelmaster"
                  data-region="central-north"
                >
                  Rotorua Apparelmaster
                </option>
                <option
                  value="coastline-apparelmaster"
                  data-region="central-north"
                >
                  Coastline Apparelmaster
                </option>
                <option
                  value="diamond-apparelmaster"
                  data-region="central-north"
                >
                  Diamond Apparelmaster
                </option>
                <option
                  value="gisborne-apparelmaster"
                  data-region="central-north"
                >
                  Gisborne Apparelmaster
                </option>
                <option
                  value="permaclean-apparelmaster"
                  data-region="central-north"
                >
                  Permaclean Apparelmaster
                </option>
                <option
                  value="lanuova-apparelmaster"
                  data-region="central-north"
                >
                  La Nuova Apparelmaster
                </option>
                <option
                  value="lanuova-apparelmaster-lower"
                  data-region="lower-north"
                >
                  La Nuova Apparelmaster
                </option>
                <option
                  value="manawatu-apparelmaster"
                  data-region="lower-north"
                >
                  Manawatu Apparelmaster
                </option>
                <option
                  value="wairarapa-apparelmaster"
                  data-region="lower-north"
                >
                  Wairarapa Apparelmaster
                </option>
                <option value="diamond-dry-cleaners" data-region="lower-north">
                  Diamond Dry Cleaners
                </option>
                <option
                  value="wellington-apparelmaster"
                  data-region="lower-north"
                >
                  Wellington Apparelmaster
                </option>
                <option
                  value="master-valet-apparelmaster"
                  data-region="south-island"
                >
                  Master Valet Apparelmaster
                </option>
                <option
                  value="christchurch-apparelmaster"
                  data-region="south-island"
                >
                  Christchurch Apparelmaster
                </option>
                <option
                  value="wrights-apparelmaster"
                  data-region="south-island"
                >
                  Wrights Apparelmaster
                </option>
                <option value="target-apparelmaster" data-region="south-island">
                  Target Apparelmaster
                </option>
                <option value="preens-apparelmaster" data-region="south-island">
                  Preens Apparelmaster
                </option>
                <option
                  value="newtone-apparelmaster"
                  data-region="south-island"
                >
                  Newtone Apparelmaster
                </option>
                <option
                  value="mccallums-apparelmaster"
                  data-region="south-island"
                >
                  McCallums Apparelmaster
                </option>
              </select>
              <img
                src="public/images/ourServices/drop-down.svg"
                alt="Dropdown"
                class="dropdown-icon"
              />
            </div>
            <div class="col-12 position-relative">
              <select
                class="form-control"
                id="hear-us"
                name="hear-us"
                placeholder="How did you hear about us?"
              >
                <option value="">How did you hear about us?</option>
                <option value="tv">TV</option>
                <option value="online-advertising">Online Advertising</option>
                <option value="online-search">Online Search</option>
                <option value="kiaora-magazine">Kiaora Magazine</option>
                <option value="facebook">Facebook</option>
                <option value="linkedin">Linkedin</option>
                <option value="youtube">YouTube</option>
                <option value="word-of-mouth">Word of Mouth</option>
                <option value="other">Other</option>
              </select>
              <img
                src="public/images/ourServices/drop-down.svg"
                alt="Dropdown"
                class="dropdown-icon"
              />
            </div>
          </div>

          <div
            class="mt-5 d-flex justify-content-center justify-content-md-start"
          >
            <button
              type="submit"
              class="btn submit-btn d-flex align-items-center justify-content-center gap-3"
            >
              Submit
              <span class="mobile-hidden">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="27"
                  height="14"
                  viewBox="0 0 27 14"
                  fill="none"
                >
                  <path
                    d="M19.0508 0.307617L25.832 6.32324L26.2549 6.69824L25.8311 7.07129L19.0498 13.0566L18.7031 13.3623L18.3711 13.041L17.9951 12.6768L17.6074 12.3008L18.0107 11.9434L23.0869 7.43945H0V5.92383H23.0869L18.0107 1.41992L17.6074 1.0625L17.9951 0.686523L18.3711 0.322266L18.7041 0L19.0508 0.307617Z"
                    fill="white"
                  />
                </svg>
              </span>
            </button>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
